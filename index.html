<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Food Forensics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&family=Special+Elite&display=swap">
<style>
/* Layout concept: a night-shift forensic lab. Dark ink-blue room, paper evidence tags and case folders on top of it, yellow evidence tape as the one loud accent. */
:root{
  --ink:#0b1e2d; --ink2:#12304a; --ink3:#1b4563; --line:#2d6286;
  --paper:#f5f8fb; --paper2:#e2ecf4; --paper-ink:#0b1e2d; --paper-mute:#46627a;
  --yellow:#ffd23f; --yellow-d:#b98f00; --mint:#4be3b0; --coral:#ff7466; --sky:#7cc8ff;
  --fg:#eef6fc; --muted:#a3bed3;
  --r:18px;
  --f-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-type:'Special Elite','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:clamp(16px,.9vw + 9px,24px)}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--f-body);font-weight:700;line-height:1.45;
  background-image:linear-gradient(rgba(124,200,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(124,200,255,.055) 1px,transparent 1px);background-size:34px 34px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:clamp(1.5rem,3vw,2.2rem)}
h3{font-size:1.25rem}
p{margin:0}
mark{background:var(--yellow);color:#241a00;border-radius:5px;padding:0 .25em}
button{font:inherit}
:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;min-height:0;overflow:auto;padding:1.2rem 16px 2.5rem}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:1.2rem}
.ic{width:1.35em;height:1.35em;flex:none}

/* buttons */
.btn{border:0;border-radius:14px;min-height:3rem;padding:.55rem 1.2rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:var(--ink3);color:var(--fg);font-weight:900;box-shadow:0 4px 0 #07131d;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #07131d}
.btn.primary{background:var(--yellow);color:#241a00;box-shadow:0 4px 0 var(--yellow-d)}
.btn.mint{background:var(--mint);color:#052a1c;box-shadow:0 4px 0 #1b9972}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.small{min-height:2.5rem;padding:.3rem .9rem;font-size:.9rem}
.btn.big{min-height:3.8rem;font-size:1.25rem;padding:.7rem 1.8rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center}
.pill{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--f-type);letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;border-radius:999px;padding:.25rem .8rem;border:2px solid var(--line);color:var(--muted);width:fit-content}
.pill.open{border-color:var(--yellow);color:var(--yellow)}
.pill.done{border-color:var(--mint);color:var(--mint)}
.pill.prog{border-color:var(--sky);color:var(--sky)}

/* hud */
.hud{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.6rem 16px;background:var(--ink2);border-bottom:3px solid var(--line)}
.hud .ttl{font-family:var(--f-display);font-size:1.2rem;margin-right:auto;min-width:0}
.hud .score{font-family:var(--f-type);color:var(--yellow);white-space:nowrap}

/* paper */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:var(--r);padding:1.1rem 1.3rem;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.paper h3{color:var(--paper-ink)}
.paper .muted{color:var(--paper-mute)}
.folder{position:relative;margin-top:1.3rem}
.folder::before{content:attr(data-tab);position:absolute;top:-1.3rem;left:1.2rem;background:var(--yellow);color:#241a00;font-family:var(--f-type);padding:.15rem .9rem;border-radius:10px 10px 0 0;font-size:.85rem;letter-spacing:.08em}
.muted{color:var(--muted)}
.tape{height:.9rem;border-radius:3px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 18px,#1a1a1a 18px 36px);width:min(28rem,100%)}

/* headquarters */
.hq{display:grid;grid-template-columns:1.1fr 1fr;gap:2rem;align-items:center;min-height:100%}
.hq-main{display:flex;flex-direction:column;gap:1.1rem;align-items:flex-start}
.hq h1{font-size:clamp(3rem,8vw,6rem);color:var(--yellow);text-shadow:0 5px 0 #7a5d00;line-height:.95}
.hq .sub{font-family:var(--f-type);font-size:clamp(1.1rem,2.2vw,1.7rem);color:var(--fg)}
.utils{display:flex;gap:.6rem;flex-wrap:wrap}
.hq-art svg{width:100%;height:auto;max-height:70vh}
.hq-wrap{padding-top:.4rem}

/* art */
.art{width:100%;height:100%;display:block}
.artbox{width:min(9rem,100%);aspect-ratio:1;margin:0 auto;background:var(--paper2);border-radius:14px;padding:.5rem}
.artbox.sm{width:6.5rem;flex:none}
.artbig{width:min(17rem,100%);aspect-ratio:1;margin:0 auto;background:var(--paper2);border-radius:18px;padding:.8rem;border:3px solid #c3d4e1}

/* briefing */
.brief{max-width:52rem;margin:0 auto;display:flex;flex-direction:column;gap:1.2rem}
.brief .typed{font-family:var(--f-type);font-size:1.15rem;display:flex;flex-direction:column;gap:.9rem}
.brief .typed p{opacity:0;animation:rise .6s ease forwards}
.brief .typed p:nth-child(2){animation-delay:1.2s}
.brief .typed p:nth-child(3){animation-delay:2.4s}
.brief .typed p:nth-child(4){animation-delay:3.2s}
.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.6rem;padding:0;margin:0;list-style:none}
.mlist li{background:var(--paper2);border-radius:12px;padding:.6rem .8rem;font-size:.9rem}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* team */
.seg{display:flex;flex-wrap:wrap;gap:.6rem}
.seg .btn[aria-pressed="true"]{background:var(--yellow);color:#241a00;box-shadow:0 4px 0 var(--yellow-d)}
.field{display:flex;flex-direction:column;gap:.4rem}
.field input{font:inherit;font-weight:800;padding:.7rem 1rem;border-radius:12px;border:3px solid #b8cddd;background:#fff;color:var(--paper-ink);min-height:3rem}
.icons{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.5rem,1fr));gap:.6rem}
.icons .btn{flex-direction:column;gap:.2rem;min-height:4.6rem;font-size:.85rem}
.icons .btn svg{width:1.8rem;height:1.8rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:3px solid #b8cddd;background:#fff;color:var(--paper-ink);border-radius:999px;padding:.4rem 1rem;font-weight:900;cursor:pointer;min-height:2.6rem}
.chip.tried{border-color:var(--coral);background:#ffe3df}
.chip:hover{border-color:var(--sky)}

/* map */
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1.1rem}
.room{display:flex;flex-direction:column;gap:.7rem;background:var(--ink2);border:3px solid var(--line);border-radius:var(--r);padding:1.1rem;position:relative}
.room.locked{opacity:.75;border-style:dashed}
.room .rno{font-family:var(--f-type);color:var(--muted);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase}
.room .ricon{width:3.4rem;height:3.4rem;border-radius:14px;background:var(--ink3);display:grid;place-items:center;color:var(--yellow)}
.room .ricon svg{width:2rem;height:2rem}
.room .obj{color:var(--muted);font-weight:700;font-size:.95rem}
.room .ev{font-family:var(--f-type);font-size:.9rem}
.room .btn{margin-top:auto}
.bar{height:.7rem;border-radius:999px;background:var(--ink);border:2px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--mint)}
.overview{display:grid;gap:.5rem}
.overview .row{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--ink2);border-radius:12px;padding:.6rem .9rem}

/* sample cards */
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1.2rem;background:linear-gradient(#173a56,#102c42);border:4px solid #0a1b28;border-radius:var(--r);padding:1.2rem}
.sample{background:var(--paper);color:var(--paper-ink);border-radius:var(--r);padding:1.6rem 1rem 1rem;display:flex;flex-direction:column;gap:.6rem;align-items:center;text-align:center;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.sample::before{content:"";position:absolute;top:.55rem;left:50%;width:.8rem;height:.8rem;border-radius:50%;background:#173a56;transform:translateX(-50%);box-shadow:inset 0 2px 0 rgba(0,0,0,.4)}
.evno{font-family:var(--f-type);letter-spacing:.12em;font-size:.85rem;color:var(--paper-mute)}
.sample .btn{width:100%}
.sample.is-done .artbox{background:#d6fbea}
.split{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:1.2rem;align-items:start}
.inspect{display:flex;flex-direction:column;gap:.8rem;align-items:center}
.inspect ul{margin:0;padding-left:1.2rem;align-self:flex-start}
.safe-note{display:flex;gap:.5rem;align-items:flex-start;background:#fff3c4;border-radius:12px;padding:.6rem .8rem;font-size:.9rem;align-self:stretch}

/* questions */
.q{display:flex;flex-direction:column;gap:.9rem}
.q .qp{font-size:1.4rem}
.clue{font-family:var(--f-type);font-size:1.05rem;background:var(--paper2);border-radius:12px;padding:.6rem .9rem}
.opts{display:flex;flex-direction:column;gap:.6rem}
.opt{display:flex;gap:.8rem;align-items:center;text-align:left;background:#fff;color:var(--paper-ink);border:3px solid #b8cddd;border-radius:14px;padding:.7rem .9rem;font-weight:800;cursor:pointer;min-height:3.4rem}
.opt:hover:not([disabled]){border-color:var(--sky);background:#eef8ff}
.opt .ltr{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--ink);color:var(--yellow);display:grid;place-items:center;font-family:var(--f-display)}
.opt .otx{flex:1;min-width:0}
.opt .tag{flex:none;font-family:var(--f-type);font-size:.78rem;border-radius:8px;padding:.1rem .5rem}
.tag.good{background:var(--mint);color:#052a1c}
.tag.bad{background:var(--coral);color:#3a0600}
.tag.rev{background:var(--yellow);color:#241a00}
.opt.good{background:#d6fbea;border-color:var(--mint)}
.opt.bad{background:#ffe3df;border-color:var(--coral)}
.opt.sel{border-color:var(--sky);background:#e6f4ff}
.opt.reveal{outline:4px dashed var(--yellow);outline-offset:2px}
.opt[disabled]{cursor:default}
.fb{border:3px solid;border-radius:14px;padding:.7rem .9rem;font-weight:800}
.fb.ok{border-color:#1b9972;background:#d6fbea;color:#06382a}
.fb.no{border-color:#d9483a;background:#ffe3df;color:#4a0d06}
.fb.close{border-color:#b98f00;background:#fff3c4;color:#3a2c00}
.fb.hint{border-color:#b98f00;background:#fff8dc;color:#3a2c00}
.fb.why{border-color:#7fa6c2;background:#eaf3fa;color:var(--paper-ink)}
.fb.support{border-color:#6a52c7;background:#efeaff;color:#1f1650}

/* matching */
.ocards{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.7rem}
.ocard{border:3px solid var(--line);background:var(--ink2);color:var(--fg);border-radius:14px;padding:.7rem .8rem;font-weight:900;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:.2rem;text-align:center;min-height:4.2rem;justify-content:center}
.ocard small{font-family:var(--f-type);color:var(--coral);font-weight:400}
.ocard.held{background:var(--yellow);color:#241a00;border-color:#fff}
.ocard.tried{border-style:dashed;border-color:var(--coral)}
.scns{display:grid;grid-template-columns:repeat(auto-fit,minmax(19rem,1fr));gap:1rem}
.scn{display:flex;gap:.9rem;align-items:center;background:var(--paper);color:var(--paper-ink);border-radius:var(--r);padding:.9rem;border:4px solid transparent;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.scn.active{border-color:var(--sky)}
.scn.over{border-color:var(--yellow);background:#fffbe6}
.scn.done{background:#e3fbf1}
.scn-body{display:flex;flex-direction:column;gap:.4rem;min-width:0;align-items:flex-start}
.scn-body p{font-size:.95rem}
.board{background:#173c58;border:6px solid #8a5a2b;border-radius:14px;padding:1.1rem;display:flex;flex-wrap:wrap;gap:.9rem;min-height:5rem}
.pin{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:.9rem .8rem .6rem;max-width:15rem;font-size:.85rem;position:relative;transform:rotate(-1.5deg);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.pin:nth-child(even){transform:rotate(1.5deg)}
.pin::before{content:"";position:absolute;top:-.4rem;left:50%;width:.9rem;height:.9rem;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9d92,#c4271a)}
.pin b{display:block;font-family:var(--f-type);font-weight:400;color:var(--paper-mute)}
.empty{color:var(--muted);font-family:var(--f-type)}
.expl .stem{font-family:var(--f-type);font-size:1.2rem}
.blank{display:inline-block;min-width:5rem;border-bottom:3px solid var(--paper-ink);text-align:center}

/* sorting */
.sortwrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:start}
.tray,.bucket{background:var(--ink2);border:3px solid var(--line);border-radius:var(--r);padding:.9rem;display:flex;flex-direction:column;gap:.7rem;min-height:12rem}
.bucket.over{border-color:var(--yellow);background:#1b3b58}
.bucket.b-spoil{border-color:#b9544a}
.bucket.b-none{border-color:#3f9b82}
.trayg{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.6rem}
.scard{background:var(--paper);color:var(--paper-ink);border:4px solid transparent;border-radius:14px;padding:.5rem;display:flex;flex-direction:column;gap:.3rem;cursor:grab;text-align:center;font-weight:800;font-size:.82rem}
.scard.sel{border-color:var(--yellow);transform:translateY(-3px)}
.scard .artbox{width:5.5rem}
.placed{display:flex;flex-wrap:wrap;gap:.5rem}
.placed .scard{cursor:default;width:7rem}

/* vault */
.vault{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:1.4rem;align-items:start}
.vaultart{background:var(--ink2);border:3px solid var(--line);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:1rem;align-items:center}
.vaultart svg{width:min(18rem,100%);height:auto}
.slots{display:flex;gap:.6rem;justify-content:center}
.slot{width:4rem;height:5rem;border-radius:12px;background:#07131d;border:3px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:2.6rem;color:var(--muted)}
.slot.on{color:var(--mint);border-color:var(--mint);animation:pop .4s ease}
.slot small{font-family:var(--f-type);font-size:.65rem;display:block;text-align:center;color:var(--muted)}
.locks{display:flex;gap:.6rem;flex-wrap:wrap}
.locks .btn[aria-current="true"]{background:var(--yellow);color:#241a00;box-shadow:0 4px 0 var(--yellow-d)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;width:min(18rem,100%)}
.keypad .btn{font-family:var(--f-display);font-size:1.6rem;min-height:3.6rem}
.found{display:flex;gap:.5rem;flex-wrap:wrap;font-family:var(--f-type)}
.found span{background:var(--ink3);border-radius:10px;padding:.3rem .7rem}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}

/* steps */
.steps{display:flex;gap:.6rem;flex-wrap:wrap}
.steps .btn[aria-current="true"]{background:var(--yellow);color:#241a00;box-shadow:0 4px 0 var(--yellow-d)}

/* results */
.report{display:flex;flex-direction:column;gap:1.1rem;position:relative}
.rhead{display:flex;gap:1rem;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
.rhead h1{font-size:clamp(1.8rem,4vw,3rem)}
.stamp{font-family:var(--f-type);border:5px solid #d9483a;color:#d9483a;border-radius:12px;padding:.2rem 1rem;font-size:2rem;letter-spacing:.1em;transform:rotate(-8deg);animation:stampIn .5s ease both;background:rgba(255,255,255,.4);width:fit-content}
.stamp.open{border-color:var(--paper-mute);color:var(--paper-mute);animation:none}
.stamp.ok{border-color:#1b9972;color:#1b9972}
@keyframes stampIn{from{transform:scale(2.2) rotate(-18deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.8rem}
.stat{background:var(--paper2);border-radius:14px;padding:.7rem 1rem;display:flex;flex-direction:column;gap:.1rem}
.stat b{font-family:var(--f-display);font-weight:400;font-size:2rem}
.stat span{font-family:var(--f-type);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-mute)}
.rsec{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1rem}
.rsec section{background:var(--paper2);border-radius:14px;padding:.8rem 1rem}
.rsec h3{font-size:1.05rem;margin-bottom:.4rem}
.rsec ul{margin:0;padding-left:1.2rem;font-size:.92rem}
.badge{display:flex;gap:.8rem;align-items:center}
.badge svg{width:4.5rem;height:4.5rem}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(4,13,20,.8);display:grid;place-items:center;padding:16px;z-index:50}
.ov.right{place-items:stretch end;padding:0}
.modal{width:min(46rem,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:1rem}
.drawer{width:min(31rem,100%);height:100%;overflow:auto;background:var(--ink2);border-left:4px solid var(--line);padding:1.1rem 1.1rem 2rem;display:flex;flex-direction:column;gap:1rem}
.drawer section{background:var(--ink);border-radius:14px;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.6rem}
.drawer h3{font-size:1.05rem;color:var(--yellow)}
.drawer .btnrow .btn{flex:1 1 8rem}
.drawer details{background:var(--ink);border-radius:12px;padding:.5rem .8rem}
.drawer summary{cursor:pointer;font-weight:900;min-height:2rem}
.drawer ol{margin:.5rem 0 0;padding-left:1.2rem;font-size:.85rem;display:flex;flex-direction:column;gap:.5rem}
.pause{text-align:center;align-items:center}
.stampwrap{display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center}
.rlist{display:flex;flex-direction:column;gap:.7rem;margin:0;padding:0;list-style:none}
.rlist li{background:var(--paper2);border-radius:12px;padding:.7rem .9rem;display:flex;flex-direction:column;gap:.3rem}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--yellow);color:#241a00;padding:.6rem 1.2rem;border-radius:999px;font-weight:900;z-index:80;max-width:calc(100% - 32px);text-align:center}
.howto ol{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:.5rem}
.sr{position:absolute;left:-9999px}

@media (max-width:900px){
  .hq,.split,.vault,.sortwrap{grid-template-columns:minmax(0,1fr)}
  .hq-art{order:-1}
  .hq-art svg{max-height:40vh}
}
@media (max-width:520px){
  .scn{flex-direction:column;align-items:flex-start}
  .slot{width:3.2rem;height:4.2rem;font-size:2rem}
}
html[data-motion="reduce"] *,html[data-motion="reduce"] *::before,html[data-motion="reduce"] *::after{animation:none!important;transition:none!important}
html[data-motion="reduce"] .brief .typed p{opacity:1}
</style>

<div id="app"></div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
(()=>{
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=s=>String(s).replace(/\[\[|\]\]/g,'');
const clueHtml=(s,on)=>esc(s).replace(/\[\[(.+?)\]\]/g,(m,t)=>on?`<mark>${t}</mark>`:t);

/* ================= CONTENT (separate from state) ================= */
const OPTS={
  causes:[
    {id:'air',label:'Air and oxygen'},{id:'moist',label:'Moisture'},{id:'enz',label:'Enzymes'},

/* ================= validation of the answer key ================= */
function validate(){
  const errs=[],seen=new Set();
  ITEMS.forEach(it=>{
    if(seen.has(it.id)) errs.push('Duplicate item id: '+it.id); seen.add(it.id);
    if(!MISSION[it.mission]) errs.push(it.id+': unknown mission');
    const opts=optionsOf(it)||[], oids=opts.map(o=>o.id);
    if(opts.length<2) errs.push(it.id+': needs at least two options');
    if(new Set(oids).size!==oids.length) errs.push(it.id+': duplicate option ids');
    if(it.correctMap){
      if(!ITEM[it.dependsOn]) errs.push(it.id+': dependsOn item missing');
      const dep=ITEM[it.dependsOn]; const depOpts=dep?optionsOf(dep).map(o=>o.id):[];
      Object.keys(it.correctMap).forEach(k=>{
        if(!depOpts.includes(k)) errs.push(it.id+': correctMap key '+k+' is not an option of '+it.dependsOn);
        it.correctMap[k].forEach(c=>{ if(!oids.includes(c)) errs.push(it.id+': correctMap answer '+c+' is not an option'); });
      });
    }else{
      if(!it.correct||!it.correct.length) errs.push(it.id+': no correct answer');
      (it.correct||[]).forEach(c=>{ if(!oids.includes(c)) errs.push(it.id+': correct id '+c+' is not an option'); });
      if(it.type!=='multi' && it.type!=='match' && it.correct && it.correct.length>1 && it.group==='code') errs.push(it.id+': code challenge needs one answer');
    }
    if(!it.explain||!it.concept) errs.push(it.id+': missing explanation or hint');
    if(it.group==='code' && !/^[0-9]$/.test(String(it.digit))) errs.push(it.id+': digit must be 0-9');
    if(it.stem && !(it.bank||[]).some(b=>b.ok)) errs.push(it.id+': explanation bank has no correct word');
  });
  if(CODE.length!==CODE_ITEMS.length || !/^[0-9]+$/.test(CODE)) errs.push('Final code could not be built from the answer key');
  return errs;
}

/* ================= state ================= */
const KEY='ff_case_v1', SKEY='ff_stats_v1';
const LS={
  get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
  del(k){try{localStorage.removeItem(k);}catch(e){}}
};
const fresh=()=>({v:1,screen:'hq',last:'map',paused:false,sound:false,motion:null,started:false,
  team:{mode:'class',name:'',icon:'lens'},items:{},awarded:{},score:0,notes:[],missionDone:{},expl:{},
  vault:{entry:'',opened:false,msg:''},conclusion:{submitted:false}});
let state=Object.assign(fresh(),LS.get(KEY)||{});
state.team=Object.assign({mode:'class',name:'',icon:'lens'},state.team||{});
state.vault=Object.assign({entry:'',opened:false,msg:''},state.vault||{});
state.conclusion=Object.assign({submitted:false},state.conclusion||{});
state.screen='hq'; state.paused=false;           /* always open on headquarters; progress is kept */
let stats=Object.assign({missed:{},runs:0},LS.get(SKEY)||{});
const ui={modal:null,active:null,held:null,scn:null,sample:null,m1:'bench',m3:'match',chal:null,explFor:null,explTried:[],explMsg:'',sortSel:null,overview:false,confirm:null};
const save=()=>{LS.set(KEY,state);LS.set(SKEY,stats);};

const S=id=>{
  if(!state.items[id]) state.items[id]={attempts:0,hint:0,done:false,tried:[],answer:null,revealed:false,review:false,sel:[],fb:null,missCounted:false};
  return state.items[id];
};

/* ================= engine ================= */
function award(key,pts){
  if(state.awarded[key]) return 0;     /* each scoring event counts once */
  state.awarded[key]=pts; state.score+=pts; return pts;
}
function isCorrect(item,ans){
  if(item.type==='multi'){
    const a=[...ans].sort(), c=[...item.correct].sort();
    return a.length===c.length && a.every((x,i)=>x===c[i]);
  }
  if(item.correctMap){
    const chosen=S(item.dependsOn).answer;
    return (item.correctMap[chosen]||[]).includes(ans);
  }
  return item.correct.includes(ans);
}
const correctIds=item=>item.correctMap?(item.correctMap[S(item.dependsOn).answer]||[]):item.correct;
const labelOf=(item,id)=>{const o=optionsOf(item).find(x=>x.id===id);return o?plain(o.label):id;};

function attempt(id,ans){
  const item=ITEM[id], st=S(id);
  if(!item||st.done) return false;
  if(item.type!=='multi' && st.tried.includes(ans)) return false;
  ui.active=id;
  const ok=isCorrect(item,ans);
  if(ok){
    st.done=true; st.answer=ans;
    const helped=st.hint>0||st.revealed;
    const pts=(!helped&&st.attempts===0)?100:(!helped&&st.attempts===1)?70:50;
    award('item:'+id,pts);
    const clean=!helped&&st.attempts===0;
    st.fb={kind:'ok',title:clean?'Excellent detective work! Evidence matched.':'Evidence matched! Add this clue to the case file.',text:item.okText||''};
    if(item.scoreExpl) award('expl:'+id,50);
    if(item.type==='match'&&item.stem&&!state.expl[id]){ui.explFor=id;ui.explTried=[];ui.explMsg='';}
    ui.held=null; ui.scn=null;
    if(item.note&&!state.notes.find(n=>n.id===id)) state.notes.push({id,text:item.note,mission:item.mission});
    tone([660,880]);
    checkMission(item.mission);
  }else{
    st.attempts++; st.review=true;
    if(item.type!=='multi') st.tried.push(ans);
    if(!st.missCounted){st.missCounted=true;stats.missed[id]=(stats.missed[id]||0)+1;}
    if(st.attempts===1){
      st.fb={kind:'no',title:'Look again.',text:'Which clue supports your answer?'};
    }else if(st.attempts===2){
      st.hint=Math.max(st.hint,1);
      st.fb={kind:'close',title:"You're getting closer.",text:'Check the highlighted clue.'};
    }else{
      st.hint=3;
      st.fb={kind:'support',title:'Let us work it out together.',text:'Read the explanation below, then try again.'};
    }
    ui.held=null;
    tone([300]);
  }
  save(); render();
  return ok;
}
function useHint(id){
  const st=S(id); st.hint=Math.min(3,st.hint+1); if(st.hint>=3) st.review=true;
  ui.active=id; save(); render();
}
function reveal(id){
  const st=S(id); if(st.done) return;
  st.revealed=true; st.hint=3; st.review=true; ui.active=id; save(); render();
}
function retryItem(id){
  const st=S(id); Object.assign(st,{attempts:0,hint:0,done:false,tried:[],answer:null,revealed:false,sel:[],fb:null,missCounted:false});
  state.notes=state.notes.filter(n=>n.id!==id); delete state.expl[id];
  ui.active=id; save(); render();
}
function missionItemsDone(mid){ return MISSION[mid].items.every(i=>S(i).done); }
function checkMission(mid){
  if(state.missionDone[mid]) return;
  if(!missionItemsDone(mid)) return;
  if(mid==='m4' && !(state.vault.opened && state.conclusion.submitted)) return;
  state.missionDone[mid]=true;
  award('mission:'+mid,100);
  if(mid==='m4') award('case',200);
  ui.modal={type:'stamp',m:mid};
  tone([523,659,784,1047],.14);
}
const missionStatus=i=>{
  const m=MISSIONS[i];
  if(state.missionDone[m.id]) return 'done';
  if(i>0 && !state.missionDone[MISSIONS[i-1].id]) return 'locked';
  return 'prog';
};
const rankName=()=>state.missionDone.m4?'Chief Food Detective':(state.missionDone.m1&&state.missionDone.m2)?'Food Detective':'Rookie Investigator';
const hintsUsed=()=>Object.values(state.items).reduce((n,s)=>n+(s.hint>0||s.revealed?1:0),0);
const reviewIds=()=>Object.keys(state.items).filter(id=>state.items[id].review&&ITEM[id]);
const doneCount=mid=>MISSION[mid].items.filter(i=>S(i).done).length;

/* explanation sentence builder (Mission 2) */
function explPick(id,i){
  const it=ITEM[id], b=it.bank[i];
  if(state.expl[id]) return;
  if(b.ok){
    state.expl[id]='word'; award('expl:'+id,50);
    ui.explFor=null; ui.explTried=[]; ui.explMsg=''; tone([660,880]); toast('Sentence built! +50 points');
  }else{
    if(!ui.explTried.includes(i)) ui.explTried.push(i);
    ui.explMsg='Not quite. Think about the clue you just matched.';
  }
  save(); render();
}
function teacherAcceptExpl(id){
  if(state.expl[id]) return;
  state.expl[id]='teacher'; award('expl:'+id,50);
  if(ui.explFor===id) ui.explFor=null;
  save(); render(); toast('Explanation accepted');
}
function pendingExpl(){ return ITEMS.filter(i=>i.stem&&S(i.id).done&&!state.expl[i.id]); }

/* code vault */
function pressKey(d){ if(state.vault.opened||state.vault.entry.length>=CODE.length) return; state.vault.entry+=d; state.vault.msg=''; tone([440+d*30],.06); save(); render(); }
function clearKey(){ state.vault.entry=''; state.vault.msg=''; save(); render(); }
function openVault(){
  if(state.vault.entry===CODE){
    state.vault.opened=true; state.vault.msg=''; award('vault',0); tone([392,523,659,784],.12);
  }else{
    state.vault.msg='That code does not open the lock. Check the digits you revealed, from Lock 1 to Lock 4.'; state.vault.entry='';
  }
  save(); render();
}
function submitReport(){
  if(!S('final').done) return;
  state.conclusion.submitted=true; state.conclusion.choice=S('final').answer;
  checkMission('m4');
  save();
  if(!ui.modal){ nav('results'); } else render();

/* sound */
let AC=null;
function tone(freqs,dur=.12){
  if(!state.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    freqs.forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain(); o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+i*dur); g.gain.exponentialRampToValueAtTime(.12,t+i*dur+.02); g.gain.exponentialRampToValueAtTime(.0001,t+i*dur+dur);
      o.connect(g); g.connect(AC.destination); o.start(t+i*dur); o.stop(t+i*dur+dur+.03);
    });
  }catch(e){}
}
let toastT=null;
function toast(t){
  const el=$('#toast'); if(!el) return;
  el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},2600);
}

function resetMission(mid){

  state.notes=state.notes.filter(n=>n.mission!==mid);
  delete state.missionDone[mid];
  if(mid==='m4'){state.vault={entry:'',opened:false,msg:''};state.conclusion={submitted:false};}
  ui.active=null;ui.held=null;ui.scn=null;ui.explFor=null;ui.sample=null;ui.m1='bench';ui.chal=null;
  save(); render(); toast('Activity reset. Points already earned stay the same.');
}

}

  const tip=held?`Holding <strong>${esc(held.label)}</strong>. Tap the clue it matches.`:(ui.scn&&sc&&!sc.done?'Clue selected. Now pick a card to test.':'Pick a card, then tap the clue it matches. You can also drag a card onto a clue.');
  const act=ui.active&&ids.includes(ui.active)?ITEM[ui.active]:null, ast=act&&S(act.id);
  return `<section aria-label="Cards"><p class="muted" style="margin-bottom:.6rem">${tip}</p>

  ${act&&(ast.fb||ast.hint>0)?`<div class="paper q"><h3>${esc(act.title)}</h3>${fbBlock(act)}</div>`:''}`;

const sentence=it=>{const w=it.bank.find(b=>b.ok).t;return (it.stem[0]+' '+w+(it.stem[1].startsWith('.')?it.stem[1]:' '+it.stem[1])).trim();};
function evidenceBoard(mid){
  const pins=MISSION[mid].items.map(i=>ITEM[i]).filter(i=>i.type==='match'&&S(i.id).done).map(i=>{
    const w=state.expl[i.id]?`<br><em>${esc(sentence(i))}</em>`:'';
    return `<div class="pin"><b>${esc(i.title)}</b>${esc(labelOf(i,S(i.id).answer))}${w}</div>`;}).join('');
  return `<div class="board">${pins||'<span class="empty">Matched clues will be pinned here.</span>'}</div>`;
}
function explPanel(){
  const id=ui.explFor; if(!id) return '';
  const it=ITEM[id]; if(!it||!it.stem||!S(id).done||state.expl[id]) return '';
  return `<section class="paper expl q" aria-label="Build the explanation"><h3>Build the explanation</h3>
    <p class="muted">You matched ${esc(it.title)}. Now finish the sentence.</p>
    <p class="stem">${esc(it.stem[0])} <span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> ${esc(it.stem[1])}</p>
    <div class="chips">${it.bank.map((b,i)=>`<button class="chip ${ui.explTried.includes(i)?'tried':''}" data-act="explPick" data-id="${id}" data-i="${i}" data-fk="ep-${i}">${esc(b.t)}</button>`).join('')}</div>
    ${ui.explMsg?`<div class="fb close" role="status">${esc(ui.explMsg)}</div>`:''}
    <div class="btnrow"><button class="btn ghost small" data-act="explSkip" data-fk="es">Skip for now</button></div></section>`;
}
function m2(){
  const ids=MISSION.m2.items;
  return `${head(MISSIONS[1],doneCount('m2'),ids.length)}
  ${matchBoard(ids,'causes')}
  ${explPanel()}
  <section aria-label="Evidence board" style="display:flex;flex-direction:column;gap:.6rem"><h3>Evidence board</h3>${evidenceBoard('m2')}
    <p class="muted">Several factors can act together, so some clues accept more than one card.</p></section>`;
}

/* ---------- Mission 3 ---------- */
function m3(){
  const all=MISSION.m3.items.map(i=>ITEM[i]);
  const match=all.filter(i=>i.group==='match'), why=all.filter(i=>i.group==='purpose'), prac=all.filter(i=>i.group==='practical');
  const steps=[['match','1. Rescue the food',match],['why','2. Why preserve food?',why],['pick','3. Pick the best method',prac]];
  const tabs=`<div class="steps" role="group" aria-label="Workshop steps">${steps.map(([v,l,its])=>{const d=its.every(i=>S(i.id).done);return `<button class="btn" data-act="step" data-v="${v}" data-fk="st-${v}" ${ui.m3===v?'aria-current="true"':''}>${d?ic('check')+' ':''}${l}</button>`;}).join('')}</div>`;
  let body='';
  if(ui.m3==='why') body=multiPanel(why[0]);
  else if(ui.m3==='pick'){
    body=qpanel(prac[0])+(S(prac[0].id).done?qpanel(prac[1]):'<p class="muted">Choose a method first. Then you will explain why it works.</p>');
    if(S(prac[1].id).done) body+=`<div class="paper"><strong>Good thinking.</strong> More than one method can work, as long as you can explain why.</div>`;
  }else body=`<p class="muted">Pick a method card, then tap the food it suits. This is a thinking activity only. Real food preservation is done by adults and food makers with proper equipment.</p>`+matchBoard(match.map(i=>i.id),'methods');
  return `${head(MISSIONS[2],doneCount('m3'),MISSION.m3.items.length)}${tabs}${body}`;
}

  </svg>`;
}
const slots=vals=>`<div class="slots" role="group" aria-label="Code slots">${vals.map((v,i)=>`<div class="slot ${v!==''?'on':''}" aria-label="Lock ${i+1}: ${v===''?'locked':v}"><span>${v===''?'?':v}</span><small>LOCK ${i+1}</small></div>`).join('')}</div>`;
function m4(){
  const total=MISSION.m4.items.length, head4=head(MISSIONS[3],doneCount('m4'),total);
  const allCode=CODE_ITEMS.every(i=>S(i.id).done);
  if(!allCode){
    const cur=ITEM[ui.chal&&ITEM[ui.chal]&&ITEM[ui.chal].group==='code'?ui.chal:(CODE_ITEMS.find(i=>!S(i.id).done)||CODE_ITEMS[0]).id];
    const vals=CODE_ITEMS.map(i=>S(i.id).done?String(i.digit):'');
    const st=S(cur.id), n=CODE_ITEMS.indexOf(cur)+1, more=CODE_ITEMS.some(i=>!S(i.id).done);
    return `${head4}<div class="vault">
      <section class="vaultart">${vaultSvg(false)}${slots(vals)}<p class="muted" style="text-align:center">Solve each challenge to reveal a digit.</p></section>
      <section style="display:flex;flex-direction:column;gap:1rem">
        <div class="locks" role="group" aria-label="Challenges">${CODE_ITEMS.map((i,k)=>`<button class="btn" data-act="chal" data-id="${i.id}" data-fk="lk-${i.id}" ${i.id===cur.id?'aria-current="true"':''}>${S(i.id).done?ic('check'):ic('lock')} Lock ${k+1}</button>`).join('')}</div>
        ${qpanel(cur)}
        ${st.done?`<div class="fb ok" role="status"><strong>Digit revealed: ${cur.digit}.</strong> It opens Lock ${n}. Remember it for the keypad.</div>${more?`<div class="btnrow"><button class="btn primary" data-act="nextLock" data-fk="next-lock">Next lock</button></div>`:''}`:''}
      </section></div>`;
  }
  if(!state.vault.opened){
    const e=state.vault.entry.split('');
    const found=CODE_ITEMS.map((i,k)=>`<span>Lock ${k+1}: ${i.digit}</span>`).join('');
    return `${head4}<div class="vault">
      <section class="vaultart">${vaultSvg(false)}${slots(CODE_ITEMS.map((_,k)=>e[k]!==undefined?e[k]:''))}</section>
      <section style="display:flex;flex-direction:column;gap:1rem;align-items:flex-start">
        <h3>Enter the vault code</h3>
        <p class="muted">Type the four digits you revealed, from Lock 1 to Lock 4.</p>
        <div class="found" aria-label="Digits you revealed">${found}</div>
        <div class="keypad" role="group" aria-label="Keypad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="btn" data-act="key" data-v="${d}" data-fk="k${d}">${d}</button>`).join('')}
          <button class="btn ghost" data-act="keyClear" data-fk="kc" aria-label="Clear">Clear</button><button class="btn" data-act="key" data-v="0" data-fk="k0">0</button><button class="btn primary" data-act="keyOpen" data-fk="ko" ${state.vault.entry.length===CODE.length?'':'disabled'}>Open</button></div>
        ${state.vault.msg?`<div class="fb close" role="status">${esc(state.vault.msg)}</div>`:''}
      </section></div>`;
  }
  const fin=ITEM.final, fst=S('final');
  const causes=ITEMS.filter(i=>i.mission==='m2'&&S(i.id).done).map(i=>i.title.replace(/^Clue [A-F]: /,'')+' ('+labelOf(i,S(i.id).answer)+')');
  const methods=ITEMS.filter(i=>i.mission==='m3'&&i.type==='match'&&S(i.id).done).map(i=>labelOf(i,S(i.id).answer));
  return `${head4}<div class="vault">
    <section class="vaultart">${vaultSvg(true)}${slots(CODE_ITEMS.map(i=>String(i.digit)))}<span class="pill done">${ic('check')} Vault open</span></section>
    <section style="display:flex;flex-direction:column;gap:1rem">
      <div class="paper folder" data-tab="YOUR CASE FILE"><div class="q">
        <h3>The evidence you collected</h3>
        <ul style="margin:0;padding-left:1.2rem">${state.notes.filter(n=>n.mission==='m1').map(n=>`<li>${esc(n.text)}</li>`).join('')||'<li class="muted">No evidence notes yet.</li>'}</ul>
        <p><strong>Causes you investigated:</strong> ${causes.length?esc(causes.join('; ')):'none yet'}</p>
        <p><strong>Methods you matched:</strong> ${methods.length?esc([...new Set(methods)].join(', ')):'none yet'}</p>
      </div></div>
      ${qpanel(fin)}

    </section></div>`;
}

function badge(rank){
  const c=rank==='Chief Food Detective'?'#4be3b0':rank==='Food Detective'?'#ffd23f':'#7cc8ff';
  return `<svg viewBox="0 0 80 96" role="img" aria-label="${esc(rank)} badge"><path d="M40 2l36 12v34c0 24-16 40-36 46C20 88 4 72 4 48V14z" fill="${c}" stroke="#0b1e2d" stroke-width="4"/><path d="M40 22l6.500 13 14.500 2-10.500 10 2.500 14.500L40 54.500 27 61.500l2.500-14.500L19 37l14.500-2z" fill="#0b1e2d"/></svg>`;
}
function reportData(){
  const n=MISSIONS.filter(m=>state.missionDone[m.id]).length;
  const causes=ITEMS.filter(i=>i.mission==='m2'&&S(i.id).done).map(i=>labelOf(i,S(i.id).answer));
  const methods=ITEMS.filter(i=>i.mission==='m3'&&i.type==='match'&&S(i.id).done).map(i=>labelOf(i,S(i.id).answer));
  const observed=state.notes.filter(x=>x.mission==='m1').map(x=>x.text);
  const fin=S('final'), concl=fin.done?labelOf(ITEM.final,fin.answer):'';
  const topics=[...new Set(reviewIds().map(id=>ITEM[id].topic).filter(Boolean))];
  return {n,solved:n===MISSIONS.length,causes:[...new Set(causes)],methods:[...new Set(methods)],observed,concl,topics,
    notes:state.notes.length,notesTotal:ITEMS.filter(i=>i.note).length,rank:rankName()};
}
function results(){
  const r=reportData();
  const ul=a=>a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="muted">Nothing recorded yet.</p>';

    </div>

      <section><h3>Evidence observed</h3>${ul(r.observed)}</section>
      <section><h3>Causes of spoilage identified</h3>${ul(r.causes)}</section>
      <section><h3>Preservation methods selected</h3>${ul(r.methods)}</section>
      <section><h3>Final explanation</h3>${r.concl?`<p>${esc(r.concl)}</p>`:'<p class="muted">The final explanation has not been chosen yet.</p>'}</section>
      <section><h3>Concepts to revisit</h3>${r.topics.length?ul(r.topics):'<p>None. Strong reasoning all the way through.</p>'}</section>
    </div>
    <div class="btnrow">
      <button class="btn" data-act="modal" data-m="review" data-fk="r-review">${ic('list')} Review difficult questions</button>
      <button class="btn" data-act="confirmReplay" data-fk="r-replay">${ic('redo')} Replay case</button>
      <button class="btn" data-act="go" data-to="hq" data-fk="r-hq">${ic('home')} Return to headquarters</button>
      <button class="btn ghost" data-act="confirmRestart" data-fk="r-restart">Restart investigation</button>
      <button class="btn ghost" data-act="copyReport" data-fk="r-copy">${ic('copy')} Copy report text</button>
    </div>
  </section>`;
}
function reportText(){
  const r=reportData(), L=[];
  L.push(`CASE #001: ${r.solved?'SOLVED':'STILL OPEN'} - The Case of the Spoiled Lunchbox`);
  if(state.team.name) L.push('Team: '+state.team.name);
  L.push(`Missions completed: ${r.n}/${MISSIONS.length}`,`Points: ${state.score}`,`Rank: ${r.rank}`,'');
  L.push('Evidence observed:',...r.observed.map(x=>'- '+x),'');
  L.push('Causes identified: '+(r.causes.join(', ')||'none'));
  L.push('Preservation methods selected: '+(r.methods.join(', ')||'none'));
  L.push('Final explanation: '+(r.concl||'not chosen'));
  L.push('Concepts to revisit: '+(r.topics.join('; ')||'none'));
  return L.join('\n');
}

function openItem(id){

}

  switch(state.screen){
    case 'brief':return brief(); case 'team':return team(); case 'map':return map();
    case 'm1':return m1(); case 'm2':return m2(); case 'm3':return m3(); case 'm4':return m4();
    case 'results':return results(); default:return hq();
  }
}
let ERRORS=[];
function render(){
  const root=$('#app'); if(!root) return;
  if(ERRORS.length){
    root.innerHTML=`<main id="main"><div class="wrap"><div class="paper"><h2 style="color:var(--paper-ink)">The case file has a problem</h2><p>The answer key failed its checks, so the game cannot start.</p><ul>${ERRORS.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div></div></main>`;
    return;
  }
  const ae=document.activeElement, fk=ae&&ae.dataset?ae.dataset.fk:null;
  const old=$('#main'), top=old?old.scrollTop:0;
  const sc=state.screen;
  root.innerHTML=`${sc==='hq'?'':hud()}<main id="main" ${state.paused?'inert':''}><div class="wrap">${screenBody()}</div></main>`;
  const mn=$('#main'); if(mn) mn.scrollTop=ui.resetScroll?0:top;
  ui.resetScroll=false;
  $('#overlay').innerHTML=overlayHTML();
  document.documentElement.dataset.motion=isReduced()?'reduce':'full';
  if(fk){ const el=document.querySelector('[data-fk="'+fk.replace(/"/g,'')+'"]'); if(el&&el.focus) try{el.focus({preventScroll:true});}catch(e){} }
}

/* ================= actions ================= */
function copyText(t){
  const done=()=>toast('Report text copied');
  const fallback=()=>{
    try{
      const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove();
      if(ok) done(); else toast('Copying is blocked here. Select the text on screen instead.');
    }catch(e){ toast('Copying is blocked here. Select the text on screen instead.'); }
  };
  try{ navigator.clipboard.writeText(t).then(done,fallback); }catch(e){ fallback(); }
}
function tryMatch(id,opt){
  const it=ITEM[id]; if(!it||S(id).done) return;
  if(S(id).tried.includes(opt)){ toast('You already tried that card on this clue. Try a different one.'); return; }
  attempt(id,opt);
}
const askConfirm=(kind,text,yes,id)=>{ ui.confirm={kind,text,yes,id}; render(); };

const ACT={
  start(){ state.started=true; nav('brief'); },
  resumeCase(){ nav(state.last&&state.last!=='hq'?state.last:'map'); },
  modal(d){ ui.modal={type:d.m}; render(); },
  close(){ ui.modal=null; ui.confirm=null; render(); },
  skipBrief(){ state.started=true; nav('map'); },
  openFile(){ nav('team'); },
  teamSkip(){ state.team.mode='class'; state.team.name=''; nav('map'); },
  teamGo(){ nav('map'); },
  mode(d){ state.team.mode=d.v; save(); render(); },
  icon(d){ state.team.icon=d.v; save(); render(); },
  nameChip(d){ state.team.name=d.v; save(); render(); },
  go(d){ nav(d.to); },
  enter(d){ const i=MISSIONS.findIndex(m=>m.id===d.to); if(i<0||missionStatus(i)==='locked') return; nav(d.to); },
  overview(){ ui.overview=!ui.overview; render(); },
  inspect(d){ ui.m1='sample'; ui.sample=d.id; ui.active=d.id; ui.resetScroll=true; render(); },
  benchBack(){ ui.m1='bench'; ui.sample=null; ui.sortSel=null; ui.resetScroll=true; render(); },
  openSort(){ ui.m1='sort'; ui.resetScroll=true; render(); },
  pick(d){ attempt(d.id,d.opt); },
  hint(d){ useHint(d.id); },
  holdOpt(d){
    if(ui.scn&&!S(ui.scn).done){ const id=ui.scn; ui.held=null; tryMatch(id,d.opt); return; }
    ui.held=ui.held===d.opt?null:d.opt; render();
  },
  pickScn(d){
    if(S(d.id).done) return;
    if(ui.held){ const o=ui.held; ui.held=null; tryMatch(d.id,o); return; }
    ui.scn=ui.scn===d.id?null:d.id; ui.active=d.id; render();
  },
  sortSel(d){ ui.sortSel=ui.sortSel===d.id?null:d.id; ui.active=d.id; render(); },
  bucket(d){
    if(!ui.sortSel){ toast('Pick a sample card first.'); return; }
    const id=ui.sortSel; ui.sortSel=null; tryMatch(id,d.opt);
  },
  toggleMulti(d){
    const st=S(d.id); if(st.done) return;
    st.sel=st.sel.includes(d.opt)?st.sel.filter(x=>x!==d.opt):st.sel.concat(d.opt); save(); render();
  },
  checkMulti(d){ const st=S(d.id); if(st.done||!st.sel.length) return; attempt(d.id,st.sel.slice()); },
  explPick(d){ explPick(d.id,+d.i); },
  explSkip(){ ui.explFor=null; render(); },
  explOpen(d){ ui.explFor=d.id; ui.explTried=[]; ui.explMsg=''; render(); },
  step(d){ ui.m3=d.v; ui.held=null; ui.scn=null; ui.resetScroll=true; render(); },
  chal(d){ ui.chal=d.id; render(); },
  nextLock(){ const n=CODE_ITEMS.find(i=>!S(i.id).done); ui.chal=n?n.id:null; render(); },
  key(d){ pressKey(d.v); },
  keyClear(){ clearKey(); },
  keyOpen(){ openVault(); },
  submitReport(){ submitReport(); },
  confirmReplay(){ askConfirm('replay','Replay the case from the start? Evidence and points for this run will be cleared. Class data stays.','Replay case'); },
  confirmRestart(){ askConfirm('restart','Restart the whole investigation, including team setup?','Restart'); },
  confirmResetMission(d){ askConfirm('resetMission','Reset this mission? Answers clear, but points already earned stay the same.','Reset mission',d.id); },
  confirmClearStats(){ askConfirm('clearStats','Clear the class data on this device?','Clear data'); },
  cancelConfirm(){ ui.confirm=null; render(); },
  doConfirm(){
    const c=ui.confirm; ui.confirm=null; if(!c){ render(); return; }
    if(c.kind==='replay'){ newCase(true); }
    else if(c.kind==='restart'){ newCase(false); state.started=false; nav('hq'); }
    else if(c.kind==='resetMission'){ ui.modal=null; resetMission(c.id); }
    else if(c.kind==='clearStats'){ stats={missed:{},runs:0}; save(); render(); toast('Class data cleared'); }
  },
  copyReport(){ copyText(reportText()); },
  practise(d){ openItem(d.id); },
  tReveal(d){ reveal(d.id); },
  tRetry(d){ retryItem(d.id); },
  tAccept(d){ teacherAcceptExpl(d.id); },
  pause(){ state.paused=true; ui.modal=null; save(); render(); },
  resume(){ state.paused=false; save(); render(); },
  sound(){ state.sound=!state.sound; save(); render(); if(state.sound) tone([523,659]); },
  motion(){ state.motion=!isReduced(); save(); render(); },
  fullscreen(){
    const msg='Fullscreen is not available here. Press F11 in your browser instead.';
    try{
      if(document.fullscreenElement){ document.exitFullscreen(); }
      else{ const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); if(p&&p.catch) p.catch(()=>toast(msg)); else if(!p) toast(msg); }
    }catch(e){ toast(msg); }
  },
  stampNext(){ const last=ui.modal&&ui.modal.m==='m4'; ui.modal=null; nav(last?'results':'map'); }
};

/* ================= events ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  if(b.dataset.self&&e.target!==b) return;
  const fn=ACT[b.dataset.act]; if(fn) fn(b.dataset,e);
});
document.addEventListener('input',e=>{ if(e.target&&e.target.id==='teamName'){ state.team.name=e.target.value.slice(0,30); save(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&(ui.modal||ui.confirm)){ ui.modal=null; ui.confirm=null; render(); } });

let dragId=null;
document.addEventListener('dragstart',e=>{
  const d=e.target.closest&&e.target.closest('[data-drag]'); if(!d) return;
  dragId=d.dataset.drag;
  try{ e.dataTransfer.setData('text/plain',dragId); e.dataTransfer.effectAllowed='move'; }catch(x){}
});
document.addEventListener('dragover',e=>{
  const t=e.target.closest&&e.target.closest('[data-drop-item],[data-drop]');
  if(t){ e.preventDefault(); t.classList.add('over'); }
});
document.addEventListener('dragleave',e=>{ const t=e.target.closest&&e.target.closest('.over'); if(t) t.classList.remove('over'); });
document.addEventListener('dragend',()=>{ document.querySelectorAll('.over').forEach(n=>n.classList.remove('over')); });
document.addEventListener('drop',e=>{
  const t=e.target.closest&&e.target.closest('[data-drop-item],[data-drop]'); if(!t) return;
  e.preventDefault(); t.classList.remove('over');
  let v=dragId; try{ v=e.dataTransfer.getData('text/plain')||dragId; }catch(x){}
  dragId=null; if(!v) return;
  if(t.dataset.dropItem) tryMatch(t.dataset.dropItem,v);
  else if(t.dataset.drop&&ITEM[v]&&ITEM[v].type==='sort') tryMatch(v,t.dataset.drop);
});

/* ================= boot ================= */
ERRORS=validate();
render();
window.__FF={get state(){return state;},ui,stats:()=>stats,attempt,useHint,reveal,retryItem,explPick,teacherAcceptExpl,pressKey,clearKey,openVault,submitReport,
  nav,render,validate,CODE,ITEMS,ITEM,MISSIONS,S,award,newCase,resetMission,missionStatus,rankName,reportData,reportText,ACT,openItem,
  reset(){ LS.del(KEY); LS.del(SKEY); }};
})();
</script>

</body></html>
